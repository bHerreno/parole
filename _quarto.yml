project:
  type: book
  output-dir: _book



book:
  title: "Parole: Functional Ecosystem"
  output-file: Parole-Functional-Ecosystem
  subtitle: "Study, design and reflections"
  author: "Brian Herreño Jiménez"

  # Chapters in reading order:
  chapters:
    - index.qmd
    - docs/concept.qmd
    - docs/installation.qmd
    - docs/basic_usage.qmd
    - docs/technical_details.qmd
    - docs/references.qmd

format:
  pdf:
    documentclass: scrreprt
    pdf-engine: lualatex
    keep-tex: true
    number-sections: true
    fontsize: 13pt
    papersize: a4
    number-depth: 3
    fig-align: "center"
    fig-pos: "t"
    toc: true
    lof: true
    lot: true
    fig-width: 9
    classoption: headings=small
    # cite-method: biblatex  # Optional biblatex citation handling
    include-before-body: banner.tex

    
classoption: "twoside,openright"
linestretch: 1.1

geometry:
  - left=3cm
  - right=2.5cm
  - top=2cm
  - bottom=3.5cm

lang: "en"
language:
  en:
    toc-title-document: "Table of contents"

crossref-lof-title: "List of figures"
crossref-lot-title: "List of tables"

# Bibliography and optional citation style
bibliography: docs/references/parole.bib
# csl: docs/apa.csl


execute:
  echo: false
  warning: false

header-includes:
  - \usepackage{tikz}
  - \usetikzlibrary{trees}
  - \usetikzlibrary{shapes.geometric}
  - \usetikzlibrary{positioning}
  - \usetikzlibrary{shapes,arrows}
  - \usepackage{lineno}
  - \usepackage{geometry}
  - \usepackage{mhchem}
  - \usepackage[margin=10pt, font=small, labelfont=bf]{caption}
  - \usepackage{enumitem}
  - \setlist{itemsep=0pt}
  - \deffootnote[3em]{1em}{9em}{~\textsuperscript{\thefootnotemark}}
  - \renewcommand*{\chapterformat}{\thechapter.\ }

include-before-body:
  text: |
   \newpage
    \pagestyle{plain}
    \ 
    \vfill
    \hfill “The gold of truth is weighed not roughly on a steelyard, but on scales of exquisite precision.”
    
    \hfill ---F. Nicolò Riccardi, approval of \textit{Il Saggiatore} (1623)
    \vfill
    \newpage
    \pagestyle{plain}
    \setcounter{page}{1}

